apiVersion: apps/v1
kind: Deployment
metadata:
  name: ExternalIntegration
  labels:
    app: ExternalIntegration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ExternalIntegration
  template:
    metadata:
      labels:
        app: ExternalIntegration
    spec:
      containers:
        - name: ExternalIntegration
          image: "username/ExternalIntegration:latest"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: '/actuator/health'
              port: 8080
            initialDelaySeconds: 15
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: '/actuator/health'
              port: 8080
            initialDelaySeconds: 15
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 5
