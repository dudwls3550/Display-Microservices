apiVersion: apps/v1
kind: Deployment
metadata:
  name: SystemMonitoring
  labels:
    app: SystemMonitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: SystemMonitoring
  template:
    metadata:
      labels:
        app: SystemMonitoring
    spec:
      containers:
        - name: SystemMonitoring
          image: "username/SystemMonitoring:latest"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: '/actuator/health'
              port: 8080
            initialDelaySeconds: 15
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: '/actuator/health'
              port: 8080
            initialDelaySeconds: 15
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 5
