name: github-action
run-name: ${{ github.actor }} is out building GitHub Actions

on:
  push:
    # Pattern matched against refs/tags
    tags:        
      - '**' 

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Maven Projects
        run: |
          mvn clean package -f ./UserManagement/pom.xml
          mvn clean package -f ./ExternalIntegration/pom.xml
          mvn clean package -f ./SystemMonitoring/pom.xml
          mvn clean package -f ./ContentManagement/pom.xml
          mvn clean package -f ./ui/pom.xml

      - name: Docker Build and push for UserManagement
        uses: docker/build-push-action@v4
        with:
          context: ./UserManagement
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/usermanagement:latest
            ghcr.io/${{ github.repository }}/usermanagement:${{ github.ref_name }}
            
      - name: Docker Build and push for ExternalIntegration
        uses: docker/build-push-action@v4
        with:
          context: ./ExternalIntegration
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/externalintegration:latest
            ghcr.io/${{ github.repository }}/externalintegration:${{ github.ref_name }}
            
      - name: Docker Build and push for SystemMonitoring
        uses: docker/build-push-action@v4
        with:
          context: ./SystemMonitoring
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/systemmonitoring:latest
            ghcr.io/${{ github.repository }}/systemmonitoring:${{ github.ref_name }}
            
      - name: Docker Build and push for ContentManagement
        uses: docker/build-push-action@v4
        with:
          context: ./ContentManagement
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/contentmanagement:latest
            ghcr.io/${{ github.repository }}/contentmanagement:${{ github.ref_name }}
            
      - name: Docker Build and push for Ui
        uses: docker/build-push-action@v4
        with:
          context: ./ui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ui:latest
            ghcr.io/${{ github.repository }}/ui:${{ github.ref_name }}
            
